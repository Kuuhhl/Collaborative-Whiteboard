name: Build and Push to S3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build_frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Git checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: npm ci
        working-directory: frontend

      - name: Production build
        run: npm run build
        working-directory: frontend

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: frontend/build
          if-no-files-found: error

  deploy_to_s3:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build_frontend
    permissions:
      id-token: write
    concurrency:
      group: deploy-frontend-production
      cancel-in-progress: false
    env:
      AWS_S3_BUCKET: ${{ vars.AWS_PRODUCTION_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: frontend/build

      - name: Assume AWS deployment role via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Deploy to S3
        run: aws s3 sync frontend/build/ "s3://${AWS_S3_BUCKET}/" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*'
