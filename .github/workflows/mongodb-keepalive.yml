name: Keep MongoDB Alive

on:
  schedule:
    - cron: "0 4 * * 0" # weekly sunday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /dynamic
          export-type: env

      - name: Install mongosh
        run: npm install -g mongosh

      - name: Ping MongoDB
        run: |
          mongosh "$MONGO_DB_URL" --quiet --eval 'db.runCommand({ ping: 1 })'
